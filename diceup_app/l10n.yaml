# Localisation codegen (M3.10, NFR-38).
#
# `flutter: generate: true` in pubspec.yaml runs gen-l10n from this
# config. Flutter 3.50 removed the synthetic `flutter_gen` package,
# so the generated classes live in lib/l10n/ next to the .arb file
# and are committed like any other source file. Re-run
# `flutter gen-l10n` after editing app_en.arb.
arb-dir: lib/l10n
template-arb-file: app_en.arb
output-localization-file: app_localizations.dart
